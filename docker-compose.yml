services:
  postgres:
    image: postgres:16-alpine
    container_name: minek8s-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minek8s
      POSTGRES_PASSWORD: minek8s_secret_change_in_production
      POSTGRES_DB: minekubernetes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minek8s -d minekubernetes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
