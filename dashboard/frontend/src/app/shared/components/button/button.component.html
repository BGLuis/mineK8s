<button class="mc-button" [ngClass]="variant()" [disabled]="disabled()">
  <div class="mc-button-bg"></div>
  
  <p class="mc-button-text">
    <ng-content></ng-content>
  </p>
  
  <div class="dec-border"></div>
  <div class="dec-1"></div>
  <div class="dec-2"></div>
  <div class="dec-3"></div>
  <div class="dec-4"></div>
  <div class="dec-5"></div>
  <div class="dec-6"></div>
  <div class="dec-7" *ngIf="variant() === 'Realms'"></div>
</button>
