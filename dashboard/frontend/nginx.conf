server {
    listen 80;
    server_name _;

    # Compressão gzip para assets Angular
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve os arquivos estáticos do build Angular
    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso: /api/* → NestJS (minekube-api-svc:3000 dentro do K8s)
    # Em dev (docker run), aponta para host.docker.internal:3000
    location /api/ {
        proxy_pass http://minekube-api-svc:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback: qualquer rota Angular retorna o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash (gerados pelo Angular build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
