[package]
name = "minecraft-protocol"
version = "0.1.0"
edition = "2021"
authors = ["mineK8s team"]
description = "Pure zero-I/O Minecraft Java edition wire protocol decoder/encoder"

[dependencies]
bytes = "1.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dev-dependencies]
hex = "0.4"
tokio = { version = "1.38", features = ["full"] }

