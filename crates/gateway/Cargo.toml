[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
authors = ["mineK8s team"]
description = "High-performance L7 reverse proxy gateway for MineKubernetes"

[lints]
workspace = true

[dependencies]
minecraft-protocol = { path = "../minecraft-protocol" }
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
governor = "0.10"
dashmap = "6.2"
uuid = { version = "1.8", features = ["v4"] }
prometheus = "0.14"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1"

[dev-dependencies]
gateway-test-support = { path = "../gateway-test-support" }
tokio-test = "0.4"
