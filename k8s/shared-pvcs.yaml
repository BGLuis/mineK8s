apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-modpack-cache
  namespace: minekubernetes
  labels:
    app.kubernetes.io/name: minekubernetes
    app.kubernetes.io/component: storage-cache
spec:
  # local-path only provisions ReadWriteOnce; on a single node that still lets every pod mount it.
  accessModes:
    - ReadWriteOnce
  storageClassName: local-nvme
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage
  namespace: minekubernetes
  labels:
    app.kubernetes.io/name: minekubernetes
    app.kubernetes.io/component: storage-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-nvme
  resources:
    requests:
      storage: 100Gi
