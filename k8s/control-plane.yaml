apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: minekubernetes
  labels:
    app.kubernetes.io/name: minekubernetes
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: minekubernetes
  labels:
    app.kubernetes.io/name: minekubernetes
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  # hostNetwork: a second pod could not bind the same ports while the old one runs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minekubernetes
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: control-plane-sa
      # The panel opens a session from the Tailscale WhoIs of the client address, so the pod must
      # see the real tailnet IP (no Service SNAT) and reach the host's tailscaled socket.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        # The Minecraft pods run as 1000 (manifest-builder.ts); files the control plane writes into
        # their /data (modpacks, restores) must stay writable by them.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # local-path creates <storage>/minekubernetes as root 0755 on the first PVC, or hostPath does
        # here; the control plane creates a server's directory itself before its PVC is ever bound.
        - name: own-servers-root
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command: ["chown", "1000:1000", "/srv/servers"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: servers-data
              mountPath: /srv/servers
        # NODE_ENV=production skips migrationsRun on boot, so the schema is built here. Postgres is a
        # StatefulSet that may still be starting; retry, then fail so the kubelet restarts the step.
        - name: migrate
          image: minekubernetes/control-plane:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              attempt=0
              until node services/control-plane/node_modules/typeorm/cli.js migration:run \
                -d services/control-plane/dist/database/data-source.js; do
                attempt=$((attempt + 1))
                [ "$attempt" -ge 30 ] && exit 1
                sleep 5
              done
          envFrom:
            - configMapRef:
                name: control-plane-config
            - secretRef:
                name: control-plane-site
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: control-plane
          image: minekubernetes/control-plane:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: control-plane-config
            - secretRef:
                name: control-plane-site
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          # The migrate init container finishes before this one starts; the probe only covers the boot,
          # and a slow one must not trip liveness.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: servers-data
              mountPath: /srv/servers
            - name: backups
              mountPath: /backups
            - name: modpack-cache
              mountPath: /cache
            - name: tailscale
              mountPath: /run/tailscale
      volumes:
        # k3s' local-path base directory (/var/lib/rancher/k3s/storage unless k3s runs with
        # --default-local-storage-path); see the pathPattern in storageclass.yaml.
        - name: servers-data
          hostPath:
            path: /var/lib/rancher/k3s/storage/minekubernetes
            type: DirectoryOrCreate
        - name: backups
          persistentVolumeClaim:
            claimName: backup-storage
        - name: modpack-cache
          persistentVolumeClaim:
            claimName: shared-modpack-cache
        - name: tailscale
          hostPath:
            path: /run/tailscale
            type: Directory
